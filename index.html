<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inaya Vhora</title>
<meta name="description" content="Inaya Vhora: an artist working in the built environment. The Wire, a live globe of AI, basic needs and the data centres being built around the world.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* Layout: one full screen. A living forest drawn in code behind; the satellite globe in the middle;
   the name top-left; the country being looked at bottom-right. One deliberate daylight look. */
:root {
  --sky: #e4ebe3;
  --ink: #1c1c1b;
  --paper: rgba(251, 251, 250, 0.9);
  --muted: #6f726b;
  --needs: #ff8a4c;
  --dc: #9fd6ff;
  --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: #c9cfc4; color: var(--ink); font: 400 12.5px/1.6 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

.bg { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.6s ease; background: #c9cfc4 url(media/forest-aerial-mist.jpg) center / cover no-repeat; }
.bg.on { opacity: 1; }
.veil { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(240,242,236,.18), rgba(30,36,30,.10) 70%); pointer-events: none; }
#birds { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.halo { position: fixed; left: 50%; top: 50%; width: var(--d, 70vmin); height: var(--d, 70vmin); transform: translate(-50%, -50%); border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,.55) 0%, rgba(255,255,255,.25) 52%, rgba(255,255,255,0) 72%); pointer-events: none; }
#globe { position: fixed; inset: 0; }
#globe canvas { outline: none; }
.maplibregl-ctrl-attrib { font-size: 10px; background: rgba(251,251,250,.7) !important; }
.maplibregl-popup-content { font: 400 12px/1.45 var(--sans); color: var(--ink); padding: 10px 12px; border-radius: 0; max-width: 280px; }
.maplibregl-popup-content b { display: block; font-weight: 500; margin-bottom: 4px; }
.maplibregl-popup-content a { display: block; padding: 3px 0; border-top: 1px solid #e4e4e0; }

nav { position: fixed; z-index: 3; left: max(20px, env(safe-area-inset-left, 0px)); top: calc(20px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 2px; background: rgba(250,250,247,.58); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.75); padding: 9px 14px; }
nav .name { font-weight: 500; }
nav a { color: var(--muted); width: fit-content; }
nav a:hover, nav a[aria-current="page"] { color: var(--ink); }

/* a callout anchored to the dot: frosted glass, joined to the place by a fine leader line */
#leader { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; overflow: visible; }
#leader line { stroke: rgba(255,255,255,.9); stroke-width: 1; }
#leader circle { fill: none; stroke: #fff; stroke-width: 1.2; }
.callout { position: fixed; z-index: 3; width: 340px; max-height: calc(100vh - 120px); overflow: auto; color: var(--ink);
           background: rgba(250, 250, 247, .58); -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3);
           border: 1px solid rgba(255,255,255,.75); box-shadow: 0 12px 40px rgba(20, 28, 20, .18);
           padding: 14px 16px 12px; display: grid; gap: 10px; opacity: 0; transform: translateY(6px); transition: opacity .6s ease, transform .6s ease; }
.callout.show { opacity: 1; transform: none; }
.callout .eyebrow { display: flex; align-items: center; gap: 8px; font: 400 10px/1.4 var(--mono); text-transform: uppercase; letter-spacing: .07em; color: #4c524b; }
.callout .eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: var(--needs); flex: none; }
.callout.dc .eyebrow i { background: var(--dc); outline: 1px solid #6aa9d6; }
.callout .x { margin-left: auto; background: none; border: 0; font: 400 16px/1 var(--sans); color: #4c524b; cursor: pointer; padding: 2px 4px; }
.callout h2 { margin: 0; font: 500 22px/1.1 var(--sans); letter-spacing: -.015em; }
.callout .story { display: grid; gap: 6px; font-size: 12.5px; line-height: 1.38; }
.callout .story a { text-decoration: underline; text-decoration-color: rgba(28,28,27,.3); text-underline-offset: 3px; }
.callout .story a:hover { text-decoration-color: var(--ink); }
.callout .story img { width: 100%; height: 120px; object-fit: cover; display: block; }
.callout .lbl { font: 400 10px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: #4c524b; display: flex; justify-content: space-between; gap: 8px; }
.callout .lbl button { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.callout .bar { display: flex; height: 8px; margin: 6px 0 4px; background: rgba(0,0,0,.08); }
.callout .bar i { display: block; height: 100%; }
.callout .bar .a, .callout .sw.a { background: #7f9b64; } .callout .bar .n, .callout .sw.n { background: #5f6f80; } .callout .bar .s, .callout .sw.s { background: #c2a676; }
.callout .key { display: flex; flex-wrap: wrap; gap: 2px 14px; font: 400 11px/1.4 var(--mono); white-space: nowrap; }
.callout .key span { display: flex; align-items: center; gap: 5px; }
.callout .sw { width: 8px; height: 8px; display: inline-block; }
.callout .defs { display: grid; gap: 4px; font-size: 11.5px; line-height: 1.4; color: #353a34; }
.callout .defs b { font-weight: 500; color: var(--ink); }
.callout details { border-top: 1px solid rgba(28,28,27,.12); padding-top: 8px; }
.callout summary { cursor: pointer; font: 400 10px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: #4c524b; list-style: none; }
.callout summary::-webkit-details-marker { display: none; }
.callout summary::after { content: " +"; } .callout details[open] summary::after { content: " –"; }
.callout dl { margin: 8px 0 0; display: grid; gap: 8px; }
.callout dt { font: 400 10px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: #4c524b; }
.callout dd { margin: 2px 0 0; font-size: 12px; line-height: 1.4; }
.callout dd small { display: block; color: #4c524b; font-size: 11px; margin-top: 2px; }
.callout .src { font: 400 9.5px/1.4 var(--mono); color: #5d625c; }
.legend { position: fixed; z-index: 3; right: max(20px, env(safe-area-inset-right, 0px)); top: calc(20px + env(safe-area-inset-top, 0px)); background: rgba(250,250,247,.58); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.75); padding: 8px 12px; font: 400 10.5px/1.7 var(--mono); color: #3f443e; display: grid; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }

@media (max-width: 640px) {
  nav { flex-direction: row; flex-wrap: wrap; gap: 2px 14px; right: 16px; left: 16px; padding: 8px 12px; }
  nav .name { width: 100%; margin-bottom: 0; }
  .legend { display: none; }
  .callout { left: 12px !important; right: 12px; top: auto !important; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: auto; max-height: 52vh; padding: 12px 14px 10px; }
  .callout h2 { font-size: 19px; }
}
</style>
</head>
<body>
<video class="bg on" id="bgA" poster="media/forest-aerial-mist.jpg" muted playsinline preload="auto" aria-hidden="true"></video>
<video class="bg" id="bgB" muted playsinline preload="auto" aria-hidden="true"></video>
<div class="veil" aria-hidden="true"></div>
<canvas id="birds" aria-hidden="true"></canvas>
<div class="halo" id="halo" aria-hidden="true"></div>
<div id="globe" role="region" aria-label="Satellite globe. Orange points are stories about AI and basic needs; blue points are data centre construction. Drag to turn, scroll or pinch to zoom."></div>

<nav aria-label="Site">
  <a class="name" href="./" aria-current="page">Inaya Vhora</a>
</nav>

<div class="legend" aria-hidden="true">
  <span><i style="background:var(--needs)"></i>AI and basic needs</span>
  <span><i style="background:var(--dc);outline:1px solid #6aa9d6"></i>Data centre construction</span>
</div>

<svg id="leader" aria-hidden="true"><line id="leadLine" x1="0" y1="0" x2="0" y2="0"/><circle id="leadDot" r="6" cx="-20" cy="-20"/></svg>
<article class="callout" id="callout" aria-live="polite" hidden></article>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
(function () {
  "use strict";
  const $ = id => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // =================================================================== the forest: real footage, looped with a crossfade
  // Aerial view of morning mist over a forest (Mixkit, free licence). Phones get a lighter file.
  const small = Math.min(innerWidth, innerHeight) < 700 || (navigator.connection && navigator.connection.saveData);
  const SRC = small ? "media/forest-aerial-mist-small.mp4" : "media/forest-aerial-mist.mp4";
  const vids = [$("bgA"), $("bgB")];
  vids.forEach(v => { v.src = SRC; v.muted = true; v.playsInline = true; });
  let cur = 0;
  if (!reduce) {
    vids[0].play().catch(() => {});
    const FADE = 1.6;
    setInterval(() => {
      const a = vids[cur], b = vids[1 - cur];
      if (a.duration && a.currentTime > a.duration - FADE - 0.1 && b.paused) {
        b.currentTime = 0; b.play().catch(() => {}); b.classList.add("on"); a.classList.remove("on");
        setTimeout(() => { a.pause(); }, FADE * 1000 + 200); cur = 1 - cur;
      }
    }, 120);
  }

  // distant birds crossing the sky (small silhouettes, upper part of the frame only)
  const fc = $("birds"), fx = fc.getContext("2d");
  let W = 0, H = 0, birds = [];
  const rand = (a, b) => a + Math.random() * (b - a);
  function sizeBirds() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight; fc.width = W * dpr; fc.height = H * dpr; fx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function flock() {   // a loose group enters from one side every so often
    const n = 5 + Math.floor(Math.random() * 7), y0 = rand(H * 0.08, H * 0.32), dir = Math.random() < 0.5 ? 1 : -1;
    for (let i = 0; i < n; i++) birds.push({ x: dir > 0 ? -20 - i * rand(8, 18) : W + 20 + i * rand(8, 18), y: y0 + rand(-14, 14) + i * rand(-2, 3),
      vx: dir * rand(0.55, 0.8), vy: rand(-0.04, 0.04), ph: rand(0, 6), rate: rand(0.009, 0.013), s: rand(0.6, 1.0), glide: 0 });
  }
  sizeBirds(); addEventListener("resize", sizeBirds);
  if (!reduce) {
    flock(); setInterval(() => { if (birds.length < 30) flock(); }, 14000);
    (function loop(t) {
      fx.clearRect(0, 0, W, H);
      fx.strokeStyle = "rgba(34,36,32,.72)"; fx.lineCap = "round"; fx.lineJoin = "round";
      for (const b of birds) {
        b.x += b.vx; b.y += b.vy + Math.sin(t * 0.0012 + b.ph) * 0.05;
        if (b.glide > 0) b.glide--; else if (Math.random() < 0.004) b.glide = 60 + Math.random() * 80;   // birds glide between wingbeats
        const f = b.glide > 0 ? 0.25 : Math.sin(t * b.rate * 6 + b.ph), w = 4.2 * b.s;
        fx.lineWidth = 1.1 * b.s;
        fx.beginPath();
        fx.moveTo(b.x - w, b.y - f * 2.4 * b.s); fx.quadraticCurveTo(b.x - w * 0.45, b.y - 1.2 - f * 0.8, b.x, b.y);
        fx.quadraticCurveTo(b.x + w * 0.45, b.y - 1.2 - f * 0.8, b.x + w, b.y - f * 2.4 * b.s);
        fx.stroke();
      }
      birds = birds.filter(b => b.x > -80 && b.x < W + 80);
      requestAnimationFrame(loop);
    })(0);
  }

  // =================================================================== the globe
  const MAPTILER_KEY = "4RJrlbyP57DSKJIwC3Ev";
  const fit = () => Math.log2(Math.min(innerWidth, innerHeight) * 0.66 * Math.PI / 512);
  function sizeHalo() { const d = Math.min(innerWidth, innerHeight) * 0.66 / 0.62; $("halo").style.setProperty("--d", d + "px"); }
  sizeHalo();
  if (!window.maplibregl) { $("globe").hidden = true; }
  const map = window.maplibregl ? new maplibregl.Map({
    container: "globe",
    canvasContextAttributes: { alpha: true, antialias: true },
    style: {
      version: 8,
      projection: { type: "globe" },
      sky: { "atmosphere-blend": ["interpolate", ["linear"], ["zoom"], 0, 0.6, 5, 0.6, 7, 0] },
      sources: {
        sat: { type: "raster", tileSize: 512, url: "https://api.maptiler.com/tiles/satellite-v2/tiles.json?key=" + MAPTILER_KEY,
               attribution: '<a href="https://www.maptiler.com/copyright/" target="_blank" rel="noopener">© MapTiler</a> <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap contributors</a>' },
        needs: { type: "geojson", data: { type: "FeatureCollection", features: [] } },
        dc: { type: "geojson", data: { type: "FeatureCollection", features: [] } },
        pulse: { type: "geojson", data: { type: "FeatureCollection", features: [] } }
      },
      layers: [
        { id: "sat", type: "raster", source: "sat" },
        { id: "pulse", type: "circle", source: "pulse", paint: { "circle-radius": ["get", "r"], "circle-color": "rgba(0,0,0,0)", "circle-stroke-color": ["get", "c"], "circle-stroke-width": 2, "circle-stroke-opacity": ["get", "o"] } },
        { id: "dc", type: "circle", source: "dc", paint: { "circle-radius": 4.5, "circle-color": "#9fd6ff", "circle-stroke-color": "#24597d", "circle-stroke-width": 1 } },
        { id: "needs", type: "circle", source: "needs", paint: { "circle-radius": ["+", 4, ["*", 2.2, ["sqrt", ["get", "n"]]]], "circle-color": "#ff8a4c", "circle-opacity": 0.92, "circle-stroke-color": "#ffffff", "circle-stroke-width": 1 } }
      ]
    },
    center: [50, 14], zoom: fit(), minZoom: 0.5, maxZoom: 18,
    attributionControl: { compact: true }, renderWorldCopies: false
  }) : null;

  let ready = false, spinning = !reduce, idle = null, pulses = [], userActive = false, backT = null;
  const stop = () => {   // the visitor took over: stop the tour until they've been idle for a while
    spinning = false; userActive = true; clearTimeout(idle); clearTimeout(backT);
    idle = setTimeout(() => { userActive = false; closeCallout(); if (!reduce) { map.easeTo({ zoom: fit(), duration: 2400 }); setTimeout(() => spinning = true, 2500); } }, 20000);
  };
  if (map) {
    map.scrollZoom.setWheelZoomRate(1 / 300);
    ["mousedown", "touchstart", "wheel"].forEach(e => map.on(e, stop));
    map.on("load", () => { ready = true; push(); });
    addEventListener("resize", () => { sizeHalo(); if (map.getZoom() < fit() + 0.5) map.setZoom(fit()); });
    map.on("move", () => { $("halo").style.opacity = map.getZoom() > fit() + 0.6 ? 0 : 1; placeCallout(); });
    addEventListener("resize", placeCallout);
    ["needs", "dc"].forEach(id => {
      map.on("mouseenter", id, () => map.getCanvas().style.cursor = "pointer");
      map.on("mouseleave", id, () => map.getCanvas().style.cursor = "");
      map.on("click", id, e => {
        stop();
        const f = e.features[0], list = JSON.parse(f.properties.items), [lon, lat] = f.geometry.coordinates;
        openCallout({ name: f.properties.name, lon, lat, items: list }, null, id);
        map.easeTo({ center: f.geometry.coordinates, zoom: Math.max(map.getZoom(), 9), duration: reduce ? 0 : 2200 });
      });
    });
    (function spin() {
      if (ready) {
        if (spinning && !map.isMoving()) { const c = map.getCenter(); map.jumpTo({ center: [c.lng + 0.035, c.lat] }); }
        if (pulses.length) {
          const t = performance.now(); pulses = pulses.filter(p => t - p.t0 < 2600);
          map.getSource("pulse").setData({ type: "FeatureCollection", features: pulses.map(p => { const k = (t - p.t0) / 2600; return { type: "Feature", geometry: { type: "Point", coordinates: [p.lon, p.lat] }, properties: { r: 6 + k * 46, o: 1 - k, c: p.c } }; }) });
        }
      }
      requestAnimationFrame(spin);
    })();
  }

  // =================================================================== the stories
  let needs = [], dcs = [], econ = {}, econIdx = {};
  const US_STATES = new Set("AL AK AZ AR CA CO CT DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY DC US".split(" "));
  function countryOf(placeName) {
    const parts = placeName.split(", "), last = parts[parts.length - 1];
    if (US_STATES.has(last)) return "United States";
    return econIdx[last.toLowerCase()] || last;
  }
  const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  const pc = v => v == null || v === "" ? "–" : (+v).toFixed(+v < 10 ? 1 : 0).replace(/\.0$/, "") + "%";

  // ---- the callout: the place, the story, and what the economy runs on
  let open = null;            // { p, it, kind }
  function openCallout(p, it, kind) {
    const el = $("callout"), country = countryOf(p.name), e = econ[country];
    const city = p.name.split(", ").length > 1 && countryOf(p.name) !== p.name.split(", ")[0] ? p.name.split(", ")[0] : "";
    const sec = (e && e.sectors) || {}, a = +sec.agriculture || 0, n = +sec.industry || 0, sv = +sec.services || 0, tot = a + n + sv;
    open = { p, it, kind };
    el.className = "callout" + (kind === "dc" ? " dc" : "");
    el.innerHTML = `
      <div class="eyebrow"><i></i>${kind === "dc" ? "Data centre construction" : "AI and basic needs"}${city ? " · " + esc(city) : ""}<button class="x" type="button" aria-label="Close">×</button></div>
      <h2>${esc(country)}</h2>
      ${it ? `<div class="story">${it.image ? `<img src="${esc(it.image)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a></div>`
           : (p.items || []).slice(0, 4).map(x => `<div class="story"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></div>`).join("")}
      ${e && tot ? `<div>
        <div class="lbl"><span>What the economy produces${sec.year ? " · " + esc(sec.year) : ""}</span><button type="button" class="defsBtn">What do these mean?</button></div>
        <div class="bar"><i class="a" style="width:${a / tot * 100}%"></i><i class="n" style="width:${n / tot * 100}%"></i><i class="s" style="width:${sv / tot * 100}%"></i></div>
        <div class="key"><span><i class="sw a"></i>Farming ${pc(a)}</span><span><i class="sw n"></i>Industry ${pc(n)}</span><span><i class="sw s"></i>Services ${pc(sv)}</span></div>
        <div class="defs" hidden>
          <span><b>Farming:</b> crops, livestock, forestry and fishing.</span>
          <span><b>Industry:</b> mining, factories, construction, and power and water supply.</span>
          <span><b>Services:</b> everything else: shops and trade, transport, banks, phones and internet, tourism, health, schools and government.</span>
          <span>Shares of all the value the country produces in a year. They may not add to 100%.</span>
        </div></div>` : ""}
      ${e ? `<details><summary>More about ${esc(country)}</summary><dl>
        ${e.exports && e.exports.length ? `<div><dt>Top exports</dt><dd>${esc(cap(e.exports.join(", ")))}</dd></div>` : ""}
        ${e.industries && e.industries.length ? `<div><dt>Main industries</dt><dd>${esc(cap(e.industries.slice(0, 6).join(", ")))}</dd></div>` : ""}
        ${e.gdp_per_capita ? `<div><dt>Value produced per person</dt><dd>US${esc(e.gdp_per_capita.replace(/^\$/, "$"))} a year
          <small>Everything the country produces in a year, divided by everyone who lives there, children included, and adjusted for local prices. It is not a wage: it includes business profits and government, and says nothing about how evenly money is shared.</small></dd></div>` : ""}
      </dl></details>
      <span class="src">Economy: CIA World Factbook</span>` : ""}`;
    el.querySelector(".x").onclick = () => { closeCallout(); };
    const db = el.querySelector(".defsBtn"); if (db) db.onclick = () => { const d = el.querySelector(".defs"); d.hidden = !d.hidden; };
    ["pointerenter", "focusin", "click"].forEach(ev => el.addEventListener(ev, () => { if (map) stop(); }));
    el.hidden = false; placeCallout(); requestAnimationFrame(() => el.classList.add("show"));
  }
  function closeCallout() {
    open = null; $("callout").classList.remove("show");
    $("leadLine").setAttribute("x1", -20); $("leadLine").setAttribute("x2", -20); $("leadDot").setAttribute("cx", -20);
  }
  function placeCallout() {
    if (!open || !map) return;
    const el = $("callout"), q = map.project([open.p.lon, open.p.lat]), w = el.offsetWidth, h = el.offsetHeight;
    const c = map.getCenter(), r = Math.PI / 180;
    const ang = Math.acos(Math.min(1, Math.sin(c.lat * r) * Math.sin(open.p.lat * r) + Math.cos(c.lat * r) * Math.cos(open.p.lat * r) * Math.cos((c.lng - open.p.lon) * r)));
    const hidden = map.getZoom() < 5 && ang > Math.PI / 2 - 0.05;
    const narrow = innerWidth < 640;
    let x, y, ax, ay;
    if (narrow) { const b = el.getBoundingClientRect(); ax = Math.max(b.left + 20, Math.min(b.right - 20, q.x)); ay = b.top; }
    else {
      const right = q.x + 70 + w < innerWidth - 20;
      x = right ? q.x + 70 : q.x - 70 - w;
      y = Math.max(90, Math.min(innerHeight - h - 20, q.y - h * 0.35));
      el.style.left = x + "px"; el.style.top = y + "px";
      ax = right ? x : x + w; ay = Math.max(y + 14, Math.min(y + h - 14, q.y));
    }
    const L = $("leadLine"), D = $("leadDot");
    if (hidden) { L.setAttribute("x1", -20); L.setAttribute("x2", -20); D.setAttribute("cx", -20); return; }
    L.setAttribute("x1", q.x); L.setAttribute("y1", q.y); L.setAttribute("x2", ax); L.setAttribute("y2", ay);
    D.setAttribute("cx", q.x); D.setAttribute("cy", q.y);
  }

  function group(items) {
    const m = new Map();
    for (const it of items) for (const p of (it.places || []).slice(0, 1)) {
      const e = m.get(p.name) || { name: p.name, lon: p.lon, lat: p.lat, items: [] }; e.items.push({ title: it.title, url: it.url }); m.set(p.name, e);
    }
    return { type: "FeatureCollection", features: [...m.values()].map(e => ({ type: "Feature", geometry: { type: "Point", coordinates: [e.lon, e.lat] }, properties: { name: e.name, n: e.items.length, items: JSON.stringify(e.items) } })) };
  }
  function push() {
    if (!ready) return;
    map.getSource("needs").setData(group(needs));
    map.getSource("dc").setData(group(dcs));
  }

  const tf = new Intl.DateTimeFormat(undefined, { day: "numeric", month: "short" });


  // a story every few seconds: the globe flies to it, the callout opens, then it eases back out
  let queue = [];
  function nextPop() {
    if (!ready || !map || userActive) return;
    if (!queue.length) queue = needs.filter(i => (i.places || []).length).slice(0, 12).map(i => ({ ...i, kind: "needs" }))
      .concat(dcs.filter(i => (i.places || []).length).slice(0, 8).map(i => ({ ...i, kind: "dc" })))
      .sort(() => Math.random() - 0.5);
    const it = queue.shift(); if (!it) return;
    const p = it.places[0];
    pulses.push({ lon: p.lon, lat: p.lat, t0: performance.now(), c: it.kind === "dc" ? "#9fd6ff" : "#ff8a4c" });
    spinning = false;
    map.flyTo({ center: [p.lon, Math.max(-60, Math.min(60, p.lat))], zoom: fit() + 1.4, duration: reduce ? 0 : 3200, curve: 1.2, essential: false });
    openCallout(p, it, it.kind);
    clearTimeout(backT);
    backT = setTimeout(() => {
      if (userActive) return;
      closeCallout();
      map.easeTo({ zoom: fit(), duration: reduce ? 0 : 2600 });
      setTimeout(() => { if (!reduce && !userActive) spinning = true; }, 2700);
    }, 9000);
  }

  async function getJSON(u) { const r = await fetch(u + "?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return r.json(); }
  async function load() {
    const [n, d, ec] = await Promise.all([getJSON("needs.json").catch(() => ({ items: [] })), getJSON("datacentres.json").catch(() => ({ items: [] })),
      Object.keys(econ).length ? Promise.resolve(null) : getJSON("economy.json").catch(() => null)]);
    if (ec) { econ = ec.items || {}; for (const [k, v] of Object.entries(econ)) { econIdx[k.toLowerCase()] = k; (v.aliases || []).forEach(a => econIdx[a.toLowerCase()] = k); } }
    needs = n.items || []; dcs = d.items || [];
    push();
  }
  load(); setInterval(load, 5 * 60 * 1000);
  setTimeout(nextPop, 2500); setInterval(nextPop, 13000);
})();
</script>
