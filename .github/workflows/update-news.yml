name: Update AI news wire

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gather headlines
        run: python fetch_news.py
      - name: Save if anything changed
        run: |
          git config user.name  "ai-news-wire"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Wire update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
