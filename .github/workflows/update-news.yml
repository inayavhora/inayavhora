name: Update AI news wire

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [fetch_news.py, .github/workflows/update-news.yml]

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  gather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gather headlines
        run: python fetch_news.py
      - name: Save if anything changed
        run: |
          git config user.name  "ai-news-wire"
          git config user.email "actions@users.noreply.github.com"
          git add news.json needs.json
          git diff --cached --quiet || git commit -m "Wire update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
